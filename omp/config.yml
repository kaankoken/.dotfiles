startup: 
  quiet: true
compaction: 
  enabled: true
  strategy: shake
memory: 
  backend: "off"
todo: 
  enabled: false
autolearn: 
  enabled: false
edit: 
  mode: hashline
lsp: 
  enabled: true
  lazy: true
  diagnosticsOnWrite: true
task: 
  batch: true
  maxConcurrency: 8
tools: 
  # yolo = Claude/Grok-style auto; smart-approve (extensions/smart-approve)
  # is the high-risk gate (force-push, rm -rf /, secrets paths, curl|sh, …).
  approvalMode: yolo
  approval: 
    read: allow
    search: allow
    find: allow
    lsp: allow
    web_search: allow
    bash: allow
    edit: allow
    write: allow
skills: 
  enabled: true
  enableClaudeUser: false
  enableClaudeProject: false
  enableCodexUser: false
  enablePiUser: false
  enablePiProject: false
  enableAgentsUser: true
  enableAgentsProject: true
  enableSkillCommands: true
  customDirectories: 
    - ~/.agents/skills/superpowers
    - ~/.agents/skills
    - ~/.omp/agent/skills
    - ~/.claude/plugins/marketplaces/caveman/skills
    - ~/.claude/plugins/marketplaces/rust-skills/skills
    - ~/.claude/plugins/marketplaces/axiom-marketplace/axiom-codex/skills
  includeSkills: 
    - using-superpowers
    - brainstorming
    - writing-plans
    - writing-skills
    - requesting-code-review
    - receiving-code-review
    - systematic-debugging
    - test-driven-development
    - subagent-driven-development
    - using-git-worktrees
    - verification-before-completion
    - finishing-a-development-branch
    - dispatching-parallel-agents
    - executing-plans
    - goal-harness
    - beads
    - caveman
    - caveman-*
    - cavecrew
    - ponytail
    - ponytail-*
    - webwright
    - coding-guidelines
    - core-*
    - domain-*
    - m0*
    - m1*
    - meta-cognition-parallel
    - rust-*
    - unsafe-checker
    - axiom-*
    - adaptive
    - agp-9-upgrade
    - android-cli
    - appfunctions
    - camera1-to-camerax
    - display-*
    - edge-to-edge
    - engage-sdk-integration
    - migrate-xml-views-to-jetpack-compose
    - navigation-3
    - perfetto-*
    - play-billing-library-version-upgrade
    - r8-analyzer
    - styles
    - testing-setup
    - verified-email
  ignoredSkills: 
    []
providers: 
  webSearchOrder: 
    - xai
    - perplexity
    - gemini
    - anthropic
    - codex
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
modelRoles: 
  default: openai-codex/gpt-5.6-sol:xhigh
symbolPreset: nerd
theme: 
  dark: dark-tokyo-night
setupVersion: 1
statusLine: 
  separator: powerline-thin
tui: 
  textSizing: true
  imeSafeCursor: true
display: 
  showTokenUsage: true
images: 
  blockImages: false
generate_image: 
  enabled: true
inspect_image: 
  mode: "on"
github: 
  enabled: true
dev: 
  autoqaConsent: granted