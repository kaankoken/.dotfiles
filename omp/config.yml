startup: 
  quiet: true
compaction: 
  enabled: true
  strategy: shake
memory: 
  backend: "off"
todo: 
  enabled: false
autolearn: 
  enabled: false
edit: 
  mode: hashline
lsp: 
  enabled: true
  lazy: true
  diagnosticsOnWrite: true
task:
  batch: true
  maxConcurrency: 8
  # Show resolved provider/model id on task/subagent spawn rows in the TUI.
  showResolvedModelBadge: true
tools:
  # yolo = Claude/Grok-style auto; smart-approve (extensions/smart-approve)
  # is the high-risk gate (force-push, rm -rf /, secrets paths, curl|sh, …).
  approvalMode: yolo
  approval:
    read: allow
    search: allow
    find: allow
    lsp: allow
    web_search: allow
    bash: allow
    edit: allow
    write: allow
  # Rare tools as xd:// devices (schemas not top-level). catalog = name lines only
  # in the mount notice — big cold-start win vs builtins (long descriptions).
  xdev: true
  xdevDocs: catalog
skills: 
  enabled: true
  enableClaudeUser: false
  enableClaudeProject: false
  enableCodexUser: false
  enablePiUser: false
  enablePiProject: false
  enableAgentsUser: true
  enableAgentsProject: true
  enableSkillCommands: true
  customDirectories: 
    - ~/.agents/skills/superpowers
    - ~/.agents/skills
    - ~/.omp/agent/skills
    - ~/.claude/plugins/marketplaces/caveman/skills
    - ~/.claude/plugins/marketplaces/rust-skills/skills
    - ~/.claude/plugins/marketplaces/axiom-marketplace/axiom-codex/skills
  # Cold-start catalog only (name+description in system prompt).
  # Domain packs (rust / axiom / android) stay on disk via customDirectories but
  # are NOT listed here — activate via /stack-rust|/stack-ios|/stack-android,
  # stack-scout / implementer, harness stack detection, or:
  #   omp --config ~/.dotfiles/omp/configs/pack-<name>.yml
  # Ultra-cold: workflow core + one router each for packs / prose / code shrink.
  # Sub-skills (caveman-*, ponytail-*, stack loaders) load via /skill or path.
  includeSkills:
    - using-superpowers
    - brainstorming
    - writing-plans
    - requesting-code-review
    - receiving-code-review
    - systematic-debugging
    - test-driven-development
    - subagent-driven-development
    - using-git-worktrees
    - verification-before-completion
    - finishing-a-development-branch
    - dispatching-parallel-agents
    - executing-plans
    - goal-harness
    - beads
    - caveman
    - ponytail
    - stack-rust
    - stack-ios
    - stack-android
  ignoredSkills:
    []
# Optional built-ins off at cold start (re-enable per session if needed).
generate_image:
  enabled: false
inspect_image:
  mode: "off"
# Built-in browser tool; webwright/CDP stays available via bash/skill when needed.
browser:
  enabled: false
providers: 
  webSearchOrder: 
    - xai
    - perplexity
    - gemini
    - anthropic
    - codex
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
modelRoles: 
  default: openai-codex/gpt-5.6-sol:xhigh
symbolPreset: nerd
theme: 
  dark: dark-tokyo-night
setupVersion: 1
statusLine: 
  separator: powerline-thin
tui: 
  textSizing: true
  imeSafeCursor: true
display:
  showTokenUsage: true
images:
  blockImages: false
github:
  enabled: true
dev:
  autoqaConsent: granted