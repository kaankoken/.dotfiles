startup: 
  quiet: true
compaction: 
  enabled: true
  strategy: shake
memory: 
  backend: "off"
todo: 
  enabled: false
autolearn: 
  enabled: false
edit: 
  mode: hashline
lsp: 
  enabled: true
  lazy: true
  diagnosticsOnWrite: true
