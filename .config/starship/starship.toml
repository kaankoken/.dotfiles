"$schema" = 'https://starship.rs/config-schema.json'

format = '$directory$all$character'
add_newline = true
right_format = '$time'
palette = 'rose-pine'

# ── Full Rosé Pine (main) palette ──────────────────────────────────────────
[palettes.rose-pine]
base = '#191724'
surface = '#1f1d2e'
overlay = '#26233a'
muted = '#6e6a86'
subtle = '#908caa'
text = '#e0def4'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ebbcba'
pine = '#31748f'
foam = '#9ccfd8'
iris = '#c4a7e7'
leaf = '#95b1ac'
highlight_low = '#21202e'
highlight_med = '#403d52'
highlight_high = '#524f67'

# ── Core ───────────────────────────────────────────────────────────────────
[character]
success_symbol = '[➜](bold fg:pine)'
error_symbol = '[➜](bold fg:love)'

[directory]
style = 'bold fg:foam'
read_only = ' 󰌾'
truncation_length = 3
truncate_to_repo = true
use_logical_path = true
format = '[$path]($style)[$read_only](fg:gold) '

[time]
disabled = false
format = '[$time]($style) '
style = 'fg:muted'
time_format = '%H:%M'

[cmd_duration]
min_time = 500
format = 'took [$duration](bold fg:gold) '

# ── Git (meaningful status + Rosé Pine colors) ─────────────────────────────
[git_branch]
symbol = ' '
style = 'bold fg:iris'
format = 'on [$symbol$branch]($style) '

[git_status]
style = 'bold'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '[⚔](fg:love)'
ahead = '[⇡${count}](fg:foam)'
behind = '[⇣${count}](fg:rose)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](fg:iris)'
up_to_date = ''
untracked = '[…](fg:gold)'
stashed = '[≡](fg:iris)'
modified = '[!](fg:gold)'
staged = '[+](fg:pine)'
renamed = '[»](fg:foam)'
deleted = '[✘](fg:love)'

[git_commit]
tag_symbol = '  '

[git_state]
style = 'bold fg:gold'
format = '([$state( $progress_current/$progress_total)]($style) )'

