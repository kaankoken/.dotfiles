# Optional overlay: Axiom/iOS domain pack.
# Reference only — nothing reads this file. Pi has no overlay `--config` schema; to
# apply an overlay, add these patterns to the session settings `skills` list.
#
# Domain skills only. The cold core (Bigpowers, adapters, architect, design-flow,
# goal-harness, the stack-* routers) is path-load-only by design — see the
# `skills` denylist in settings.json — so it is not repeated here.
#
# Pack roots are not installed on this machine; path-load via /stack-ios.
skills:
  includeSkills:
    - axiom-*
